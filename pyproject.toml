[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optical-systems-portfolio"
version = "0.1.0"
description = "Reusable Python models for optical communication system analysis and validation."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
]

[tool.setuptools.packages.find]
include = ["optical_systems*"]
